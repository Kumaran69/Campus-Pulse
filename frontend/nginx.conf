server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Serve the file if it exists (JS/CSS/images), otherwise fall back
    # to index.html so React Router can handle the route client-side.
    # Without this, refreshing on any route other than "/" (e.g. /login,
    # /student/copilot) returns a real 404 from nginx instead of the app.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
