version: "3.9"

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  ml-service:
    build: ./ml-service
    restart: unless-stopped
    ports:
      - "8001:8001"

  rag-service:
    build: ./rag-service
    restart: unless-stopped
    ports:
      - "8002:8002"

  backend:
    build: ./backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGO_URI=mongodb://mongo:27017/campus_pulse
      - JWT_SECRET=change_this_in_production
      - JWT_EXPIRES_IN=7d
      - ML_SERVICE_URL=http://ml-service:8001
      - RAG_SERVICE_URL=http://rag-service:8002
      - CLIENT_ORIGIN=http://localhost:5173
    depends_on:
      - mongo
      - ml-service
      - rag-service

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  mongo_data:
